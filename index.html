<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Alron Lewis | Dyrroth AR</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080808; color: #fff; font-family: Arial, sans-serif; }
    #start { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 26px; background: radial-gradient(circle at 50% 35%, #252525, #080808 70%); text-align: center; }
    .panel { width: min(100%, 420px); }
    h1 { font-size: 27px; margin: 0 0 12px; }
    p { color: #c7c7c7; line-height: 1.55; margin: 0 auto 22px; }
    button { border: 0; border-radius: 999px; padding: 15px 26px; background: #fff; color: #111; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; }
    #error { color: #ff8d8d; font-size: 14px; line-height: 1.5; margin-top: 16px; overflow-wrap: anywhere; }
    #status { position: fixed; z-index: 5; top: max(14px, env(safe-area-inset-top)); left: 12px; right: 12px; padding: 11px 14px; border-radius: 12px; background: #0009; color: white; text-align: center; font-size: 14px; pointer-events: none; }
    #status:empty { display: none; }
  </style>
  <!-- MindAR 1.2.5 expects the classic global THREE build. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
</head>
<body>
  <main id="start">
    <div class="panel">
      <h1>Bring this artwork to life</h1>
      <p>Allow camera access, then point your phone at the Dyrroth drawing.</p>
      <button id="startButton" type="button">Start AR Camera</button>
      <div id="error" role="alert"></div>
    </div>
  </main>
  <div id="status" aria-live="polite"></div>
  <script>
    const startScreen = document.getElementById('start');
    const startButton = document.getElementById('startButton');
    const statusText = document.getElementById('status');
    const errorText = document.getElementById('error');
    let arStarted = false;

    startButton.addEventListener('click', async () => {
      if (arStarted) return;
      startButton.disabled = true;
      startButton.textContent = 'Starting camera…';
      errorText.textContent = '';
      statusText.textContent = 'Checking AR engine…';

      try {
        if (!window.isSecureContext) {
          throw new Error('Camera access requires HTTPS. Open this page using its https://github.io address.');
        }
        if (!window.THREE) throw new Error('The 3D library did not load. Check your internet connection and reload this page.');
        if (!window.MINDAR || !window.MINDAR.IMAGE) throw new Error('The AR library did not load. Check your internet connection and reload this page.');

        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.body,
          imageTargetSrc: './targets.mind',
          maxTrack: 1,
          uiLoading: 'no',
          uiScanning: 'no',
          uiError: 'no'
        });

        const { renderer, scene, camera } = mindarThree;
        const anchor = mindarThree.addAnchor(0);

        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.12, 0.15, 48),
          new THREE.MeshBasicMaterial({ color: 0x00ff99, side: THREE.DoubleSide })
        );
        ring.position.z = 0.02;
        ring.visible = false;
        anchor.group.add(ring);

        anchor.onTargetFound = () => {
          statusText.textContent = 'Artwork recognised!';
          ring.visible = true;
        };
        anchor.onTargetLost = () => {
          statusText.textContent = 'Looking for your drawing…';
          ring.visible = false;
        };

        statusText.textContent = 'Requesting camera permission…';
        await mindarThree.start();
        arStarted = true;
        startScreen.style.display = 'none';
        statusText.textContent = 'Point your camera at the drawing';
        renderer.setAnimationLoop(() => renderer.render(scene, camera));
      } catch (err) {
        console.error('AR startup failed:', err);
        statusText.textContent = '';
        let message = err && err.message ? err.message : 'Could not start the AR camera.';
        if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
          message = 'Camera permission was blocked. Allow camera access for this site in your browser settings, then tap Try Again.';
        } else if (err && err.name === 'NotFoundError') {
          message = 'No camera was found on this device.';
        } else if (err && err.name === 'NotReadableError') {
          message = 'The camera is busy in another app. Close other camera apps and try again.';
        }
        errorText.textContent = message;
        startButton.disabled = false;
        startButton.textContent = 'Try Again';
      }
    });
  </script>
</body>
</html>
