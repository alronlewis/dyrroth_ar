
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Alron Lewis | AR Artwork</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #111;
      padding: 24px;
    }

    #start button {
      padding: 15px 28px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 17px;
      margin-top: 20px;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      z-index: 5;
      text-align: center;
      font-size: 15px;
      padding: 10px;
      pointer-events: none;
    }

    #error {
      color: #ff7777;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
</head>

<body>

  <div id="start">
    <div>
      <h2>Bring this artwork to life</h2>

      <p>
        Point your camera at your Dyrroth drawing
        and discover the AR experience.
      </p>

      <button id="startButton">
        Start AR Camera
      </button>

      <div id="error"></div>
    </div>
  </div>

  <div id="status">
    Camera not started
  </div>

  <script>
    const startScreen =
      document.getElementById("start");

    const startButton =
      document.getElementById("startButton");

    const statusText =
      document.getElementById("status");

    const errorText =
      document.getElementById("error");

    startButton.addEventListener("click", async () => {

      startButton.disabled = true;
      startButton.textContent = "Starting camera...";
      errorText.textContent = "";

      try {

        const mindarThree =
          new window.MINDAR.IMAGE.MindARThree({

            container: document.body,

            imageTargetSrc: "./targets.mind",

            maxTrack: 1,

            uiLoading: "no",
            uiScanning: "no",
            uiError: "no"

          });

        const {
          renderer,
          scene,
          camera
        } = mindarThree;

        const anchor =
          mindarThree.addAnchor(0);

        // Create a simple visual indicator.
        const geometry =
          new THREE.RingGeometry(0.12, 0.15, 32);

        const material =
          new THREE.MeshBasicMaterial({
            color: 0x00ff88,
            side: THREE.DoubleSide
          });

        const ring =
          new THREE.Mesh(geometry, material);

        ring.position.set(0, 0, 0.02);

        anchor.group.add(ring);

        anchor.onTargetFound = () => {

          statusText.textContent =
            "Artwork recognized! AR is working.";

          ring.visible = true;

        };

        anchor.onTargetLost = () => {

          statusText.textContent =
            "Looking for your artwork...";

          ring.visible = false;

        };

        ring.visible = false;

        statusText.textContent =
          "Loading AR engine...";

        await mindarThree.start();

        startScreen.style.display = "none";

        statusText.textContent =
          "Point your camera at your drawing";

        renderer.setAnimationLoop(() => {

          renderer.render(scene, camera);

        });

      } catch (error) {

        console.error(error);

        errorText.textContent =
          error.message || "Unable to start AR.";

        startButton.disabled = false;

        startButton.textContent =
          "Try Again";

      }

    });
  </script>

</body>
</html>
